[package]
name = "snowie"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Snow on your Windows desktop: drifts on windows and the taskbar, snowballs, snowmen, a snowplow and New Year fireworks"
license = "MIT"
readme = "README.md"
keywords = ["snow", "desktop", "windows", "overlay", "winter"]
categories = ["games", "multimedia"]

[dependencies]
eframe = "0.37.0"
fastrand = "2"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
