name: macOS

on:
  push:
    branches: [macos]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Package Snowie.app
        run: |
          APP=dist/Snowie.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/Snowie" \
            target/aarch64-apple-darwin/release/snowie target/x86_64-apple-darwin/release/snowie
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Snowie</string>
              <key>CFBundleDisplayName</key><string>Snowie</string>
              <key>CFBundleIdentifier</key><string>band.tems.snowie</string>
              <key>CFBundleExecutable</key><string>Snowie</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>LSUIElement</key><true/>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sips -s format icns -z 512 512 site/assets/favicon.png --out "$APP/Contents/Resources/AppIcon.icns" || true
          codesign --force --deep -s - "$APP"
          cd dist && ditto -c -k --keepParent Snowie.app Snowie-macos.zip
      - name: Smoke test with a screenshot
        run: |
          open ~ || true
          sleep 2
          SNOWIE_PRESNOW=1 dist/Snowie.app/Contents/MacOS/Snowie > snowie.log 2>&1 &
          PID=$!
          sleep 12
          screencapture -x shot.png || true
          if kill -0 $PID 2>/dev/null; then echo "Snowie is running"; else echo "Snowie exited early"; cat snowie.log; fi
          kill $PID 2>/dev/null || true
          cat snowie.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: Snowie-macos
          path: dist/Snowie-macos.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            shot.png
            snowie.log
